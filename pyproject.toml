[project]
name = "program-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.109.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "ruff>=0.13.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["models", "services", "scripts"]
exclude = ["example_json*", "pdf-programs*", "parsing-pipeline-out*"]

[project.scripts]
programgen = "main:main"
